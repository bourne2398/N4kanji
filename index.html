<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="JLPT N4 Kanji Flashcards - Fully offline" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <title>N4 Kanji Flashcards</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="header" id="header">
      <div class="header-left">
        <h1 id="headerTitle">N4</h1>
        <span class="progress-text" id="progressText">0/0</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="resetBtn" title="Reset">↺</button>
      </div>
    </header>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <main class="main" id="main">
      <div class="card-container" id="cardContainer">
        <div class="flashcard" id="flashcard">
          <div class="card-face card-front">
            <div class="front-content">
              <div class="card-type" id="cardType"></div>
              <div class="main-text" id="mainText">漢</div>
              <div class="sub-text" id="subText"></div>
            </div>
          </div>
          <div class="card-face card-back">
            <div class="back-content">
              <div class="reading-group">
                <span class="label" id="backLabel1">音</span>
                <span class="reading" id="backVal1">—</span>
              </div>
              <div class="reading-group">
                <span class="label" id="backLabel2">訓</span>
                <span class="reading" id="backVal2">—</span>
              </div>
              <div class="meaning" id="backMeaning">—</div>
              <div class="parent-kanji" id="parentKanji"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions" id="actions">
        <button class="action-btn dont-know" id="dontKnowBtn" title="Don't Know">✕</button>
        <button class="action-btn flip-btn" id="flipBtn" title="Flip">⟳</button>
        <button class="action-btn knew" id="knewBtn" title="Knew">✓</button>
      </div>

      <div class="review-controls hidden" id="reviewControls">
        <button class="action-btn review-prev" id="prevBtn" title="Previous">‹</button>
        <button class="action-btn flip-btn" id="reviewFlipBtn" title="Flip">⟳</button>
        <button class="action-btn review-next" id="nextBtn" title="Next">›</button>
        <button class="action-btn review-remove" id="removeBtn" title="Remove">🗑</button>
      </div>
    </main>

    <div class="empty-state-full hidden" id="emptyState">
      <div class="empty-icon" id="emptyIcon">✓</div>
      <p id="emptyText">No cards yet</p>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="study" title="Study">
        <span class="tab-icon">🎴</span>
      </button>
      <button class="tab" data-tab="knew" title="Knew">
        <span class="tab-icon">✓</span>
        <span class="badge" id="knewBadge">0</span>
      </button>
      <button class="tab" data-tab="dontknow" title="Don't Know">
        <span class="tab-icon">✕</span>
        <span class="badge" id="dontKnowBadge">0</span>
      </button>
    </nav>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Offline ready'))
          .catch(err => console.log('SW error', err));
      });
    }
  </script>
</body>
</html>
